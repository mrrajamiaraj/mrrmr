name: Keep Supabase awake

# Free Supabase projects pause after a week without activity. This makes one tiny
# database request every day so that never happens.
on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database through the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Set the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets." >&2
            exit 1
          fi
          # Anonymous access to the tables is revoked, so this returns 401/403 with no data,
          # but PostgREST still runs the query in Postgres, which counts as activity.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$SUPABASE_URL/rest/v1/accounts?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase responded with HTTP $code"
          case "$code" in
            2??|401|403|404) exit 0 ;;
            *) exit 1 ;;
          esac
