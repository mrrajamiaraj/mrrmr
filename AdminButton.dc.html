<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="display: inline-flex; font-family: 'Outfit', system-ui, sans-serif; color: #0F172A; font-size: 15px; line-height: 1.45">
<button type="button" onClick="{{openIt}}" aria-haspopup="dialog" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #5EEAD4; background: #0B3D38; color: #FFFFFF; font-weight: 600; font-size: 15px; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
Admin</button>

<sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
<div style="position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 60; text-align: left">
<div role="dialog" aria-modal="true" aria-labelledby="admin-h" style="width: 100%; max-width: 520px; max-height: calc(100vh - 32px); overflow-y: auto; background: #FFFFFF; border-radius: 14px; box-shadow: 0 24px 60px rgba(15, 23, 42, 0.35)">

<div style="background: #0F4C45; color: #FFFFFF; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h2 id="admin-h" style="margin: 0; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
Admin password</h2>
<button type="button" onClick="{{closeIt}}" aria-label="Close" style="width: 44px; height: 44px; border: none; background: transparent; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px; background: #F0FDFA; border: 1px solid #99F6E4; border-radius: 12px; padding: 12px 14px">
<span style="width: 38px; height: 38px; flex: none; border-radius: 50%; background: #0F4C45; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 700">A</span>
<div style="flex: 1 1 auto; min-width: 0">
<div style="font-weight: 600">Signed in as Admin</div>
<div style="font-size: 13.5px; color: #475569">Password last changed {{lastChanged}}</div>
</div>
</div>

<label style="display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14.5px">Current password *
<input type="{{pwType}}" onInput="{{setCur}}" autocomplete="current-password" placeholder="Enter current password" style="min-height: 46px; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; font-family: inherit; font-weight: 400"></label>

<label style="display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14.5px">New password *
<input type="{{pwType}}" onInput="{{setNew}}" autocomplete="new-password" placeholder="At least 8 characters" style="min-height: 46px; padding: 0 14px; border: 2px solid #14B8A6; border-radius: 10px; font-size: 15px; font-family: inherit; font-weight: 400"></label>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 6px" aria-hidden="true">
<sc-for list="{{segments}}" as="s" hint-placeholder-count="4">
<span style="flex: 1 1 0; height: 6px; border-radius: 3px; background: {{s.color}}"></span>
</sc-for>
</div>
<div style="font-size: 13.5px; color: {{strengthColor}}; font-weight: 600">Strength: {{strengthLabel}}</div>
<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-size: 13.5px">
<sc-for list="{{rules}}" as="r" hint-placeholder-count="4">
<li style="color: {{r.color}}; display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="font-weight: 700; width: 14px">{{r.mark}}</span>{{r.label}}</li>
</sc-for>
</ul>
</div>

<label style="display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14.5px">Confirm new password *
<input type="{{pwType}}" onInput="{{setConf}}" autocomplete="new-password" placeholder="Type the new password again" style="min-height: 46px; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; font-family: inherit; font-weight: 400"></label>
<sc-if value="{{showMatch}}" hint-placeholder-val="{{ false }}">
<div style="font-size: 13.5px; font-weight: 600; color: {{matchColor}}; margin-top: -8px">{{matchText}}</div>
</sc-if>

<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14.5px; cursor: pointer">
<input type="checkbox" onChange="{{toggleShow}}" style="width: 18px; height: 18px; accent-color: #0F766E">
Show passwords</label>

<sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="background: #FEE2E2; color: #991B1B; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 500">{{error}}</div>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div role="status" style="background: #D1FAE5; color: #065F46; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 500">Admin password updated. Use the new password next time you sign in.</div>
</sc-if>
</div>

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 20px; border-top: 1px solid #E5E7EB; background: #F8FAFC">
<button type="button" style="min-height: 44px; padding: 0 4px; border: none; background: transparent; color: #0F766E; font-size: 14.5px; font-weight: 600; font-family: inherit; cursor: pointer">Forgot password?</button>
<div style="display: flex; gap: 10px">
<button type="button" onClick="{{closeIt}}" style="min-height: 44px; padding: 0 16px; border: none; background: transparent; color: #334155; font-size: 15px; font-weight: 500; font-family: inherit; cursor: pointer">Cancel</button>
<button type="button" onClick="{{submit}}" style="min-height: 44px; padding: 0 20px; border: none; border-radius: 10px; background: #0F4C45; color: #FFFFFF; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer">Update password</button>
</div>
</div>

</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"previewOpen":{"editor":"boolean","default":true},"$preview":{"width":640,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var open = st.open ?? (this.props.previewOpen ?? true);
    var cur = st.cur || '', nw = st.nw || '', conf = st.conf || '';
    var rules = [
      { label: 'At least 8 characters', ok: nw.length >= 8 },
      { label: 'One uppercase letter', ok: /[A-Z]/.test(nw) },
      { label: 'One number', ok: /[0-9]/.test(nw) },
      { label: 'One symbol (!@#…)', ok: /[^A-Za-z0-9]/.test(nw) }
    ];
    var score = rules.filter(function (r) { return r.ok; }).length;
    var levels = [['Too weak', '#B91C1C', '#EF4444'], ['Weak', '#B91C1C', '#EF4444'], ['Fair', '#B45309', '#F59E0B'], ['Good', '#1D4ED8', '#3B82F6'], ['Strong', '#047857', '#10B981']];
    var lv = nw ? levels[score] : ['—', '#64748B', '#E2E8F0'];
    var segments = [0, 1, 2, 3].map(function (i) { return { color: nw && i < Math.max(score, 1) ? lv[2] : '#E2E8F0' }; });
    var match = conf.length > 0 && conf === nw;
    return {
      open: open,
      openIt: function () { self.setState({ open: true, error: '', done: false }); },
      closeIt: function () { self.setState({ open: false, error: '', done: false }); },
      pwType: st.show ? 'text' : 'password',
      toggleShow: function () { self.setState({ show: !st.show }); },
      setCur: function (e) { self.setState({ cur: e.target.value, error: '', done: false }); },
      setNew: function (e) { self.setState({ nw: e.target.value, error: '', done: false }); },
      setConf: function (e) { self.setState({ conf: e.target.value, error: '', done: false }); },
      segments: segments, strengthLabel: lv[0], strengthColor: lv[1],
      rules: rules.map(function (r) { return { label: r.label, mark: r.ok ? '✓' : '○', color: r.ok ? '#047857' : '#64748B' }; }),
      showMatch: conf.length > 0,
      matchText: match ? '✓ Passwords match' : 'Passwords do not match yet',
      matchColor: match ? '#047857' : '#B91C1C',
      lastChanged: st.lastChanged || 'Sep 14, 2026',
      error: st.error || '', hasError: !!st.error, done: !!st.done,
      submit: function () {
        var err = '';
        if (!cur) err = 'Enter your current password.';
        else if (score < 4) err = 'The new password does not meet all four requirements.';
        else if (nw === cur) err = 'The new password must be different from the current one.';
        else if (nw !== conf) err = 'The two new passwords do not match.';
        if (err) self.setState({ error: err, done: false });
        else self.setState({ error: '', done: true, lastChanged: 'Oct 12, 2026' });
      }
    };
  }
}
</script>
</body>
</html>
