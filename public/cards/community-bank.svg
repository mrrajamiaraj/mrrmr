<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" role="img" aria-label="Community Bank Visa Platinum credit card illustration">
  <!-- MRRMR original illustration (not official card art) for the Community Bank Visa Platinum credit card: black
       brushed metal with a fine diagonal texture, sweeping silver curves, a soft light sheen, a silver chip and
       contactless waves, and a small Community Bank blue (#058ED0) accent. No logos, wordmarks or trademarks. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3D42"/>
      <stop offset="0.45" stop-color="#232528"/>
      <stop offset="1" stop-color="#121315"/>
    </linearGradient>
    <pattern id="brush" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="none"/>
      <path d="M0 0 V6" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="light" cx="0.62" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9ECF0" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#E9ECF0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E9ECF0" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1F3F6"/>
      <stop offset="0.5" stop-color="#B9BEC7"/>
      <stop offset="1" stop-color="#7E8591"/>
    </linearGradient>
    <linearGradient id="tab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#058ED0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#32327B" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="r"><rect width="856" height="540" rx="38"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="856" height="540" fill="url(#base)"/>
    <rect width="856" height="540" fill="url(#brush)"/>
    <rect width="856" height="540" fill="url(#light)"/>
    <!-- Sweeping silver curves -->
    <g fill="none" stroke="url(#silver)">
      <path d="M210 -20 C 120 160, 160 360, 520 560" stroke-width="2.4"/>
      <path d="M250 -20 C 170 170, 220 380, 600 560" stroke-width="1.2"/>
      <path d="M560 -20 C 420 120, 470 330, 900 440" stroke-width="1.6"/>
    </g>
    <!-- Community Bank blue accent where the issuer panel sits (no logo) -->
    <path d="M560 0 H856 V36 L600 58 Z" fill="url(#tab)" opacity="0.85"/>
    <!-- Chip -->
    <rect x="64" y="200" width="92" height="70" rx="12" fill="url(#chip)"/>
    <g fill="none" stroke="#5E6470" stroke-opacity="0.6" stroke-width="2">
      <path d="M64 224 H96 M124 224 H156 M64 246 H96 M124 246 H156 M96 200 C 104 214, 104 256, 96 270 M124 200 C 116 214, 116 256, 124 270"/>
    </g>
    <!-- Contactless -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="5" stroke-linecap="round" transform="translate(186 214)">
      <path d="M0 6 a 30 30 0 0 1 0 30"/><path d="M14 -4 a 46 46 0 0 1 0 50"/><path d="M28 -14 a 62 62 0 0 1 0 70"/>
    </g>
    <rect x="0.5" y="0.5" width="855" height="539" rx="38" fill="none" stroke="#FFFFFF" stroke-opacity="0.12"/>
  </g>
</svg>
