<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" role="img" aria-label="Community Bank credit card illustration">
  <!-- MRRMR original illustration (not official card art). Colours from Community Bank Bangladesh's website:
       blue #058ED0, navy #32327B (communitybankbd.com, read 2026-11-19). Platinum-tone lines for the product tier.
       No logos or trademarks. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3A8C"/>
      <stop offset="0.5" stop-color="#32327B"/>
      <stop offset="1" stop-color="#1C1C4D"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#058ED0" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#058ED0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#20A6E6" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="plat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9EDF2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E9EDF2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E9EDF2" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1F3F6"/>
      <stop offset="0.5" stop-color="#C3C9D2"/>
      <stop offset="1" stop-color="#8E96A3"/>
    </linearGradient>
    <clipPath id="r"><rect width="856" height="540" rx="38"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="856" height="540" fill="url(#base)"/>
    <path d="M380 -20 C 520 160, 640 260, 900 300 L 900 -20 Z" fill="url(#wash)"/>
    <g fill="none" stroke="url(#plat)" stroke-width="1.6">
      <path d="M-20 430 C 180 360, 420 470, 880 330"/>
      <path d="M-20 450 C 180 380, 420 490, 880 350"/>
      <path d="M-20 470 C 180 400, 420 510, 880 370"/>
      <path d="M-20 490 C 180 420, 420 530, 880 390"/>
      <path d="M-20 510 C 180 440, 420 550, 880 410"/>
    </g>
    <g fill="#FFFFFF" fill-opacity="0.06">
      <circle cx="770" cy="470" r="150"/><circle cx="640" cy="470" r="150"/>
    </g>
    <rect x="64" y="200" width="92" height="70" rx="12" fill="url(#chip)"/>
    <g fill="none" stroke="#6E7685" stroke-opacity="0.55" stroke-width="2">
      <path d="M64 224 H100 M120 224 H156 M64 246 H100 M120 246 H156 M110 200 V270"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="5" stroke-linecap="round" transform="translate(186 214)">
      <path d="M0 6 a 30 30 0 0 1 0 30"/><path d="M14 -4 a 46 46 0 0 1 0 50"/><path d="M28 -14 a 62 62 0 0 1 0 70"/>
    </g>
    <rect x="0.5" y="0.5" width="855" height="539" rx="38" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>
  </g>
</svg>
